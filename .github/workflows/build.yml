name: Build Hades Overlay APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip HadesOverlay-source.zip -d source

      - name: Build APK
        working-directory: source/HadesLoader-main
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HadesOverlay-APK
          path: source/HadesLoader-main/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
